<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>數學闖關</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6d5dd3">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="數學闖關">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;background:linear-gradient(165deg,#f4f0ff,#e6dfff 60%,#ffe9f4);color:#2b2160}
  .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:calc(24px + env(safe-area-inset-top,0)) 24px calc(24px + env(safe-area-inset-bottom,0));box-sizing:border-box}
  .icon{width:150px;height:150px;border-radius:36px;box-shadow:0 14px 30px rgba(80,60,180,.28);animation:bob 2.2s ease-in-out infinite}
  h1{margin:6px 0 0;font-size:2rem;letter-spacing:2px}
  .sub{color:#5b4bc4;font-weight:700}
  .go{display:block;width:min(320px,100%);margin-top:10px;background:linear-gradient(135deg,#7c6cf0,#5b4bc4);color:#fff;text-decoration:none;font-size:1.3rem;font-weight:800;padding:18px 0;border-radius:18px;box-shadow:0 10px 24px rgba(91,75,196,.35)}
  .go:active{transform:scale(.97)}
  .note{font-size:.88rem;color:#555;line-height:1.7;max-width:320px}
  #off{display:none;color:#b91c1c;font-weight:700}
  @keyframes bob{50%{transform:translateY(-8px)}}
  @media (prefers-reduced-motion:reduce){.icon{animation:none}}
  @media (prefers-color-scheme:dark){html,body{background:linear-gradient(165deg,#1b1a33,#24204a);color:#eee}.sub{color:#b9b2ff}.note{color:#bbb}}
</style>
</head>
<body>
<div class="wrap">
  <img class="icon" src="icon-192.png" alt="">
  <h1>數學闖關</h1>
  <div class="sub">國二數學・段考複習</div>
  <a class="go" id="go" href="#">開始闖關 ▶</a>
  <div id="off">現在沒有網路，連上網路後再按「開始闖關」。</div>
  <div class="note">帳號、積分、錯題都和原本的網頁一樣。<br>第一次可能要再登入一次。</div>
</div>
<script>
  /* iPhone 的 App 模式不讓嵌入的網頁叫出鍵盤，所以直接打開遊戲網址（不嵌入） */
  var GAME = 'https://script.google.com/macros/s/AKfycbwDlDkxuUSzlL5-SkqiZsO5P1wNBlJ7k-wPfVb4SGLksu23TBN3BR2SmRC4_SbT5NGVvQ/exec';
  var go = document.getElementById('go');
  go.href = GAME;
  function net() { document.getElementById('off').style.display = navigator.onLine ? 'none' : 'block'; }
  window.addEventListener('online', net); window.addEventListener('offline', net); net();
  /* 打開 App 時自動進遊戲一次；從遊戲回來（關掉遊戲視窗）就停在這頁，按按鈕再進去 */
  try {
    if (navigator.onLine && !sessionStorage.getItem('mq_auto')) { sessionStorage.setItem('mq_auto', '1'); setTimeout(function () { location.href = GAME; }, 700); }
  } catch (e) {}
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
